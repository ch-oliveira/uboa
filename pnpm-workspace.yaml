packages:
  - "apps/*"
  - "packages/*"
overrides:
  hono: ">=4.12.34"
  "@hono/node-server": ">=1.19.15"
allowBuilds:
  '@google/genai': set this to true or false
  '@prisma/client': true
  '@prisma/engines': true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  protobufjs: set this to true or false
  workerd: true
minimumReleaseAgeExclude:
  - '@turbo/darwin-64@2.11.3'
  - '@turbo/darwin-arm64@2.11.3'
  - '@turbo/linux-64@2.11.3'
  - '@turbo/linux-arm64@2.11.3'
  - '@turbo/windows-64@2.11.3'
  - '@turbo/windows-arm64@2.11.3'
  - turbo@2.11.3
