version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: predial_postgis
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-root}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rootpassword}
      POSTGRES_DB: ${POSTGRES_DB:-predial_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - predial_db_data:/var/lib/postgresql/data
    restart: always

volumes:
  predial_db_data:
